<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0f" />
  <title>World in Their Eyes</title>
  <meta name="description" content="An interactive fan atlas — explore the places, gigs and stories behind the music." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="brand" id="brand-btn" aria-label="Switch atlas" title="Switch atlas">
        <span class="brand-mark" id="brand-mark"></span>
        <div class="brand-text">
          <h1 id="band-title">World in Their Eyes</h1>
          <p id="band-tagline"></p>
        </div>
      </button>
      <div class="topbar-actions">
        <button class="progress-pill" id="progress-pill" aria-label="Your pilgrimage passport">
          <span class="progress-ring" id="progress-ring"></span>
          <span id="progress-count">0</span>
        </button>
        <button class="account-btn account-btn--search" id="search-btn" aria-label="Search places">🔍</button>
        <button class="account-btn" id="trips-btn" aria-label="Guided trips">🧭</button>
        <button class="account-btn" id="lang-btn" aria-label="Change language">🌐</button>
        <button class="account-btn" id="mode-btn" aria-label="Toggle light or dark mode">◐</button>
        <button class="account-btn" id="account-btn" aria-label="Account">☻</button>
      </div>
    </header>

    <nav class="filters" id="filters" aria-label="Filter places by category"></nav>

    <div class="search" id="search" hidden>
      <input id="search-input" type="search" placeholder="Search places, releases, gigs… ( / )" autocomplete="off" />
      <div class="search-results" id="search-results"></div>
    </div>

    <div id="map" role="application" aria-label="Interactive band history map"></div>

    <div class="timeline" id="timeline">
      <span class="timeline-year" id="timeline-label"></span>
      <div class="timeline-sliders">
        <div class="timeline-track"><span id="timeline-fill"></span></div>
        <input type="range" id="timeline-from" aria-label="Show places from year" />
        <input type="range" id="timeline-to" aria-label="Show places up to year" />
      </div>
    </div>

    <div class="trip-bar" id="trip-bar" hidden>
      <span class="trip-countdown" id="trip-countdown"></span>
      <div class="trip-head">
        <strong id="trip-title"></strong>
        <button class="trip-nav trip-exit" id="trip-exit" aria-label="End trip">✕</button>
      </div>
      <div class="trip-progress" id="trip-progress" aria-hidden="true"></div>
      <div class="trip-controls">
        <button class="trip-nav" id="trip-prev" aria-label="Previous stop">‹</button>
        <button class="trip-info" id="trip-info" aria-label="Reopen current stop">
          <strong id="trip-stop-title"></strong>
          <span id="trip-step"></span>
        </button>
        <button class="trip-nav trip-play" id="trip-play" aria-label="Play or pause auto-advance">▶</button>
        <button class="trip-nav" id="trip-next" aria-label="Next stop">›</button>
      </div>
    </div>

    <article class="sheet" id="sheet" aria-live="polite">
      <div class="sheet-handle"></div>
      <div class="sheet-body" id="sheet-body"></div>
    </article>

    <div class="toast" id="toast" role="status"></div>

    <div class="modal" id="modal" role="dialog" aria-modal="true">
      <div class="modal-card" id="modal-card"></div>
    </div>

    <section class="admin" id="admin-console" role="dialog" aria-label="Admin console" hidden></section>

    <section class="wall" id="wall" role="dialog" aria-label="Stories at this place"></section>

    <section class="sideshow" id="sideshow" role="dialog" aria-label="Sideshow"></section>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
